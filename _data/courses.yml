# Courses on the Teaching page. Add one by copying a block — no HTML required.
#
#   title       course number and name
#   term        when it runs, e.g. "Autumn 2026" — optional
#   instructors list of names — optional
#   head_cas    list of co-head CAs — optional
#   cas         list of course assistants — optional
#
# Names on the instructors, head_cas, and cas lines are bolded automatically
# when they match a `name` in _data/people.yml, so spell lab members exactly as
# they appear there.
#   description one or two plain sentences
#   url         the course site
#   link_text   the link's wording; defaults to "Course site"

