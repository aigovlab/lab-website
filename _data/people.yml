# Everyone in the People section of the homepage. To add someone, copy a block
# and fill it in — no HTML required.
#
#   name           displayed name
#   last_name      the part of the name to alphabetize by; each group is sorted
#                  by this, so it is required even when it looks redundant
#   role           title shown under the name
#   group          which section they appear in; see _data/people_groups.yml
#                  (faculty | members | alumni)
#   photo          filename inside assets/img/ — omit for a blank avatar circle
#   photo_position "top" crops the portrait toward the top of the frame, for
#                  photos where centering cuts off the head; omit otherwise
#   url            their faculty or personal page; the whole card becomes a
#                  link to it. Omit and the card renders as plain text.

- name: Rob Reich
  last_name: Reich
  role: Faculty Director
  group: faculty
  photo: rob-reich.jpg
  url: https://politicalscience.stanford.edu/people/rob-reich

- name: Roberta Fischli
  last_name: Fischli
  role: Postdoctoral Scholar
  group: members
  photo: roberta-fischli.jpg
  photo_position: top
  url: https://politicalscience.stanford.edu/people/roberta-leonie-claude-fischli

- name: Yasi Khan
  last_name: Khan
  role: Predoctoral Scholar
  group: members
  photo: yasi-khan.jpg
  url: https://yrkhan.com

