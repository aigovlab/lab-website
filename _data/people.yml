- name: Yasi Khan
  role: Research Affiliate
  group: members
  photo: yasi-khan.jpg
  bio: >-
    Studies the techno-ideologies that shape Silicon Valley discourse, including
    transhumanism, effective altruism, and accelerationism. Also researches AI
    personhood and AI's role in political polarization. Stanford BS in Symbolic
    Systems; MSc from Oxford.
