# --- Site ---
title: "AI Governance Lab"
short_title: "AI Governance Lab"
subtitle: "at Stanford University"
description: >-
  The AI Governance Lab at Stanford University — research on how law, policy,
  and institutions can keep pace with rapidly advancing artificial intelligence.

# GitHub Pages serves this repo from a project path, not a domain root, so
# `baseurl` must stay the repo name. Every internal link and asset goes through
# the `relative_url` filter, which prepends it — drop that and the CSS 404s in
# production while still looking fine locally.
url: "https://aigovlab.github.io"
baseurl: "/lab-website"

# Referenced from the footer and the Substack section; change it in one place.
substack_url: "https://aigovlab.substack.com/"

# The photo behind the lab name at the top of the homepage. Right now this is a
# generated placeholder. To use a real photo: drop it in assets/img/ (landscape,
# at least 1600px wide) and point this at it, e.g. /assets/img/hero.jpg
hero_image: /assets/img/hero-placeholder.svg

# --- Build ---
markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge
timezone: America/Los_Angeles

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
