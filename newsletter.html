<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "dark" && t !== "light") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <title>Newsletter — AI Governance Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css?family=Lato:400,400i,700,700i|Courier+Prime:400,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <nav id="top-nav">
    <div class="nav-left">
      <a id="logo" href="index.html">AI Governance Lab</a>
      <a class="nav-link" href="index.html">home</a>
      <a class="nav-link" href="people.html">people</a>
      <a class="nav-link" href="teaching.html">teaching</a>
      <a class="nav-link active" href="newsletter.html">substack</a>
    </div>
    <button class="theme-toggle" type="button">☾</button>
  </nav>

  <main>
    <h1>Substack</h1>

      The lab publishes on Substack —
      <a href="https://aigovlab.substack.com/" target="_blank" rel="noopener">read it at aigovlab.substack.com →</a>
    </p>

    <div class="substack-embed">
      <iframe
        src="https://aigovlab.substack.com/embed"
        width="100%"

        scrolling="no"
      ></iframe>
    </div>
  </main>

  <footer>AI Governance Lab · Stanford University · <a href="https://aigovlab.substack.com/" target="_blank" rel="noopener">Substack</a> · <a href="https://www.stanford.edu/accessibility">Accessibility</a></footer>

  <script src="assets/js/theme.js"></script>
</body>
</html>
