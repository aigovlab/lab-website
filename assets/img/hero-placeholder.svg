<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="">
  <!-- Placeholder hero backdrop. Swap it by dropping a photo in assets/img/
       and pointing `hero_image` in _config.yml at the new file. -->
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d1111"/>
      <stop offset="55%" stop-color="#3a0c0c"/>
      <stop offset="100%" stop-color="#14100d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.18" r="0.75">
      <stop offset="0%" stop-color="#b03434" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#b03434" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rules" width="1600" height="26" patternUnits="userSpaceOnUse">
      <rect width="1600" height="26" fill="none"/>
      <line x1="0" y1="25.5" x2="1600" y2="25.5" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#wash)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#rules)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.07">
    <circle cx="1235" cy="620" r="150"/>
    <circle cx="1235" cy="620" r="255"/>
    <circle cx="1235" cy="620" r="370"/>
  </g>
</svg>
